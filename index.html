<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>絶対に押すな - 最強・崩壊編</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* タップ時の青枠を消す */
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh; /* スマホのアドレスバー対策 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #111;
      color: #fff;
      font-family: 'Reggae One', sans-serif;
      text-align: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation; /* ダブルタップ拡大防止 */
      transition: all 0.1s;
    }

    #message {
      font-size: clamp(1.2rem, 5vw, 2rem);
      margin-bottom: 2rem;
      padding: 0 10px;
      min-height: 3rem;
      color: #f1c40f;
      text-shadow: 2px 2px 0 #000;
      z-index: 50;
    }

    .btn {
      padding: 18px 36px;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      color: #fff;
      background-color: #e74c3c;
      border: 3px solid #c0392b;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px #8b0000;
      position: relative;
      z-index: 10;
      font-family: 'Reggae One', sans-serif;
      transition: transform 0.1s;
    }
    .btn:active {
      box-shadow: 0 2px #8b0000;
      transform: translateY(6px);
    }

    /* 増殖ボタン */
    .clone-btn {
      position: absolute;
      padding: 10px 18px;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      background-color: #ff4500;
      animation: popClone 0.3s forwards;
    }
    @keyframes popClone {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* コンテナ共通 */
    #attack-image-container, #paa-container, #daisaku-container, #noise-container, #alert-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      display: none; justify-content: center; align-items: center; flex-direction: column;
      cursor: pointer; z-index: 100;
    }

    /* 襲来画像 */
    #attack-image-container { background-color: #000; }
    #attack-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 高速回転パァ */
    #paa-container { background-color: #ff1493; }
    .paa-text {
      font-size: clamp(4rem, 20vw, 10rem);
      color: #fff; text-shadow: 5px 5px 0px #000;
      animation: spinCrazy 0.2s linear infinite;
    }
    @keyframes spinCrazy { 100% { transform: rotate(360deg) scale(1.3); } }

    /* ★ ダいｻｧ~9 演出 ★ */
    #daisaku-container { background-color: #0a0014; }
    #daisaku-container img {
      max-width: 80%;
      max-height: 45vh;
      object-fit: contain;
      margin-bottom: 20px;
    }
    .daisaku-text {
      font-size: clamp(3rem, 14vw, 8rem);
      color: #00ffcc;
      text-shadow: 4px 4px 0px #ff0055, -4px -4px 0px #000;
      animation: daisakuGlitch 0.12s infinite;
      word-break: break-all;
    }
    @keyframes daisakuGlitch {
      0% { transform: scale(1) translate(0, 0) skewX(0deg); color: #00ffcc; }
      20% { transform: scale(1.15) translate(-8px, 6px) skewX(12deg); color: #ff0055; }
      40% { transform: scale(0.9) translate(8px, -6px) skewX(-12deg); color: #ffff00; }
      60% { transform: scale(1.1) translate(-6px, -4px) skewX(6deg); color: #00ffff; }
      80% { transform: scale(0.95) translate(6px, 4px) skewX(-6deg); color: #ff00ff; }
      100% { transform: scale(1) translate(0, 0) skewX(0deg); color: #00ffcc; }
    }

    /* 砂嵐 */
    #noise-container { background-color: #000; z-index: 300; }
    #static-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.9; }

    /* 最終崩壊アラート */
    #alert-container { background: red; z-index: 400; overflow: hidden; }
    .alert-title {
      font-size: clamp(2.5rem, 12vw, 6rem);
      color: yellow;
      text-shadow: 0 0 20px #000;
      animation: blinkFast 0.1s infinite;
      word-break: break-word;
    }
    
    /* フェイクエラーポップアップ */
    .fake-error {
      position: absolute;
      background: #ece9d8;
      border: 2px solid #0055ea;
      color: #000;
      font-family: 'MS PGothic', sans-serif;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
      padding: 0;
      width: min(280px, 75vw);
      z-index: 500;
    }
    .fake-error-header { background: #0055ea; color: white; padding: 4px 8px; font-weight: bold; font-size: 12px; text-align: left;}
    .fake-error-body { padding: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;}
    .fake-error-btn { margin: 8px; padding: 4px 16px; cursor: pointer; }

    /* 画面全体崩壊エフェクト */
    .screen-collapse {
      animation: collapse 0.1s infinite !important;
      filter: invert(1) hue-rotate(90deg);
    }

    @keyframes blinkFast { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes collapse {
      0% { transform: translate(5px, -5px) rotate(1deg); background-color: red;}
      50% { transform: translate(-5px, 5px) rotate(-1deg); background-color: black;}
      100% { transform: translate(5px, 5px) rotate(1deg); background-color: yellow;}
    }
  </style>
</head>
<body>

  <div id="message">絶対にこのボタンを押さないでください。</div>
  <button class="btn" id="jokeBtn" onclick="nextStage()">押すな</button>

  <div id="attack-image-container" onclick="nextStage()">
    <img src="shurai.png" alt="何かかが襲来" onerror="this.src='shurai.jpg'">
  </div>

  <div id="paa-container" onclick="nextStage()">
    <div class="paa-text">( ᐛ👐)パァ</div>
  </div>

  <div id="daisaku-container" onclick="nextStage()">
    <img src="daisaku.png" alt="ダいｻｧ~9" onerror="this.src='daisaku.jpg'; this.onerror=function(){this.style.display='none';}">
    <div class="daisaku-text">ダいｻｧ~9</div>
  </div>

  <div id="noise-container" onclick="nextStage()">
    <canvas id="static-canvas"></canvas>
    <div style="position:relative; z-index:301; font-size:clamp(1.5rem, 6vw, 3rem); color:red; text-shadow:2px 2px #000;">ｼﾞｼﾞｼﾞ… (タップ)</div>
  </div>

  <div id="alert-container" onclick="location.reload()">
    <div class="alert-title">CRITICAL ERROR</div>
    <div style="font-size:clamp(1.2rem, 5vw, 2rem); margin-top:20px; color:#fff;">[ タップで強制再起動 ]</div>
  </div>

  <script>
    const messages = [
      "だから押すなと言ったでしょう！",
      "次押したら本当に何かが起きますよ？",
      "しつこいですね。",
      "（ボタンが逃げ出そうとしている…）",
      "増殖開始まで 3",
      "2",
      "1"
    ];

    let count = 0;
    const dodgePhase = 3;    // ボタンが逃げ始める
    const clonePhase = 7;    // ボタンが増殖し始める
    const attackCount = 15;  // 襲来画像 (shurai.png)
    const paaCount = 16;     // パァ
    const daisakuCount = 17; // ★ ダいｻｧ~9 ★
    const noiseCount = 18;   // 砂嵐（音＋映像）
    const alertCount = 19;   // 最終崩壊

    const btnElem = document.getElementById("jokeBtn");
    const msgElem = document.getElementById("message");
    let audioCtx = null;
    let noiseNode = null;
    let errorInterval = null;

    // 音声機能の初期化（iOS/Safari制限の解除）
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ボタンが逃げる処理（マウスホバー & スマホタッチ両対応）
    function handleDodge(e) {
      if (count >= dodgePhase && count < clonePhase) {
        if (e.type === 'touchstart') e.preventDefault();
        btnElem.style.position = 'absolute';
        const maxX = window.innerWidth - btnElem.offsetWidth - 20;
        const maxY = window.innerHeight - btnElem.offsetHeight - 20;
        btnElem.style.left = Math.max(10, Math.random() * maxX) + 'px';
        btnElem.style.top = Math.max(10, Math.random() * maxY) + 'px';
      }
    }
    btnElem.addEventListener('mouseover', handleDodge);
    btnElem.addEventListener('touchstart', handleDodge, { passive: false });

    function nextStage() {
      initAudio();
      count++;

      // メッセージ更新
      if (count < messages.length) {
        msgElem.innerText = messages[count];
      } else if (count < attackCount) {
        msgElem.innerText = "押せ押せ押せ押せ！！！";
        msgElem.style.color = "red";
      }

      // 増殖フェーズ
      if (count >= clonePhase && count < attackCount) {
        btnElem.style.position = 'absolute';
        for(let i=0; i<3; i++) spawnCloneButton();
      }

      // 各フェーズの切り替え
      if (count === attackCount) {
        document.querySelectorAll('.clone-btn').forEach(e => e.remove());
        document.getElementById("attack-image-container").style.display = 'flex';
      }
      if (count === paaCount) {
        document.getElementById("attack-image-container").style.display = 'none';
        document.getElementById("paa-container").style.display = 'flex';
      }
      if (count === daisakuCount) {
        document.getElementById("paa-container").style.display = 'none';
        document.getElementById("daisaku-container").style.display = 'flex';
      }
      if (count === noiseCount) {
        document.getElementById("daisaku-container").style.display = 'none';
        document.getElementById("noise-container").style.display = 'flex';
        startNoise();
      }
      if (count >= alertCount) {
        stopNoise();
        document.getElementById("noise-container").style.display = 'none';
        triggerUltimateCollapse();
      }
    }

    // ボタン増殖関数
    function spawnCloneButton() {
      const btn = document.createElement('button');
      btn.innerText = "押すな";
      btn.className = "btn clone-btn";
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight - 50;
      btn.style.left = Math.max(10, Math.random() * maxX) + 'px';
      btn.style.top = Math.max(10, Math.random() * maxY) + 'px';
      btn.onclick = nextStage;
      document.body.appendChild(btn);
    }

    // 砂嵐（映像とノイズ音）
    function startNoise() {
      initAudio();

      const canvas = document.getElementById('static-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth / 2;
      canvas.height = window.innerHeight / 2;

      function renderNoise() {
        const imgData = ctx.createImageData(canvas.width, canvas.height);
        const buffer = new Uint32Array(imgData.data.buffer);
        for (let i = 0; i < buffer.length; i++) buffer[i] = Math.random() < 0.5 ? 0xff000000 : 0xffffffff;
        ctx.putImageData(imgData, 0, 0);
        if (count === noiseCount) requestAnimationFrame(renderNoise);
      }
      renderNoise();

      // ホワイトノイズ生成
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      const gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.2;

      noiseNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      noiseNode.start();
    }

    function stopNoise() {
      if (noiseNode) {
        try { noiseNode.stop(); } catch(e){}
        noiseNode = null;
      }
    }

    // 最終崩壊処理
    function triggerUltimateCollapse() {
      initAudio();
      document.body.classList.add('screen-collapse');
      document.getElementById("alert-container").style.display = 'flex';

      setInterval(() => {
        if (!audioCtx) return;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sawtooth';
        osc2.type = 'square';
        
        osc1.frequency.value = Math.random() * 1000 + 200;
        osc2.frequency.value = osc1.frequency.value + 30;

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start(); osc2.start();
        osc1.stop(audioCtx.currentTime + 0.1);
        osc2.stop(audioCtx.currentTime + 0.1);
      }, 80);

      errorInterval = setInterval(createFakeError, 200);
    }

    // フェイクエラー生成
    function createFakeError() {
      if(document.querySelectorAll('.fake-error').length > 40) return;

      const errDiv = document.createElement('div');
      errDiv.className = 'fake-error';
      const maxX = window.innerWidth - 220;
      const maxY = window.innerHeight - 120;
      errDiv.style.left = Math.max(10, Math.random() * maxX) + 'px';
      errDiv.style.top = Math.max(10, Math.random() * maxY) + 'px';
      
      errDiv.innerHTML = `
        <div class="fake-error-header">System Error</div>
        <div class="fake-error-body">
          <span style="font-size:24px; color:red;">❌</span>
          <div>致命的なエラー。<br>システムが崩壊中。</div>
        </div>
        <div style="text-align:center;">
          <button class="fake-error-btn">OK</button>
        </div>
      `;
      document.getElementById("alert-container").appendChild(errDiv);
    }
  </script>
</body>
</html>
